  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f4f4f9; margin: 0; }
    .order-container { max-width: 500px; margin: auto; }
    h2 { color: #333; text-align: center; margin-bottom: 15px; }
    
    /* Category Filter Buttons */
    .category-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
    .category-container::-webkit-scrollbar { display: none; }
    .cat-btn { background: #e0e0e0; color: #333; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .cat-btn.active { background: #28a745; color: white; }

    /* Product Cards */
    .card { background: white; padding: 12px 15px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .item-name { font-weight: bold; color: #333; font-size: 15px; }
    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .btn-action { width: 32px; height: 32px; border: none; border-radius: 6px; font-weight: bold; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-minus { background: #dc3545; color: white; }
    .btn-plus { background: #28a745; color: white; }
    .qty-number { font-weight: bold; font-size: 16px; min-width: 20px; text-align: center; }
    
    /* Cart Area */
    .cart { background: white; padding: 15px; margin-top: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    .submit-btn { width: 100%; background: #0088cc; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; }
  </style>

    function renderCategories() {
      const catList = document.getElementById('category-list');
      catList.innerHTML = categories.map(cat => `
        <button class="cat-btn ${cat === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</button>
      `).join('');
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      const list = document.getElementById('items-list');
      const filtered = currentCategory === 'ទាំងអស់' 
        ? products 
        : products.filter(p => p.category === currentCategory);

      list.innerHTML = filtered.map(p => {
        const qty = cart[p.name] || 0;
        return `
          <div class="card">
            <span class="item-name">${p.name}</span>
            <div class="qty-controls">
              ${qty > 0 ? `<button class="btn-action btn-minus" onclick="removeFromCart('${p.name}')">-</button>` : ''}
              ${qty > 0 ? `<span class="qty-number">${qty}</span>` : ''}
              <button class="btn-action btn-plus" onclick="addToCart('${p.name}')">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function addToCart(name) {
      cart[name] = (cart[name] || 0) + 1;
      renderProducts();
      updateCartUI();
    }

    function removeFromCart(name) {
      if (cart[name]) {
        cart[name] -= 1;
        if (cart[name] <= 0) delete cart[name];
      }
      renderProducts();
      updateCartUI();
    }

    function updateCartUI() {
      const details = document.getElementById('cart-details');
      const keys = Object.keys(cart);
      if (keys.length === 0) {
        details.innerHTML = 'មិនទាន់មានទំនិញ';
        return;
      }
      details.innerHTML = keys.map(k => `<div>• ${k} x <b>${cart[k]}</b></div>`).join('');
    }

    function sendOrder() {
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;

      if (!name || !phone) {
        alert('សូមបញ្ចូលឈ្មោះ និងលេខទូរស័ព្ទ!');
        return;
      }

      const keys = Object.keys(cart);
      if (keys.length === 0) {
        alert('សូមជ្រើសរើសទំនិញយ៉ាងហោចណាស់ ១!');
        return;
      }

      let orderText = `🛒 *មាន Order ថ្មី (ពី GitHub Menu)*\n\n`;
      orderText += `👤 *ឈ្មោះ:* ${name}\n`;
      orderText += `📞 *ទូរស័ព្ទ:* ${phone}\n\n`;
      orderText += `📦 *មុខទំនិញ:*\n`;
      keys.forEach(k => {
        orderText += `- ${k}: ${cart[k]}\n`;
      });

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: orderText,
          parse_mode: 'Markdown'
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          alert('ការកុម្ម៉ង់បានជោគជ័យ!');
          cart = {};
          renderProducts();
          updateCartUI();
          document.getElementById('cust-name').value = '';
          document.getElementById('cust-phone').value = '';
        } else {
          alert('មានបញ្ហាក្នុងការផ្ញើ Order!');
        }
      });
    }

    // Init App
    renderCategories();
    renderProducts();
  </script>
